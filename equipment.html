<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Equipment Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #1e293b;
        }

        .navbar {
            background: #1e293b;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 22px;
        }

        .back-btn {
            background: #475569;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-section h2 {
            font-size: 25px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        /* FORM */

        .form-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .form-container h3 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        .form-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .save-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .cancel-btn {
            background: #64748b;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* SEARCH */

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        /* TABLE */

        .table-container {
            background: white;
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #e2e8f0;
            font-weight: bold;
        }

        tr:hover {
            background: #f8fafc;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .available {
            color: #16a34a;
            font-weight: bold;
        }

        .borrowed {
            color: #dc2626;
            font-weight: bold;
        }

        .message {
            margin-bottom: 15px;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .top-section {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <h1>Equipment Borrowing System</h1>

        <button class="back-btn" onclick="location.href='index.html'">
            ← Dashboard
        </button>

    </div>


    <!-- MAIN -->

    <div class="container">

        <div class="top-section">

            <h2>Equipment Management</h2>

            <button class="add-btn" id="showFormBtn">
                + Add Equipment
            </button>

        </div>


        <!-- MESSAGE -->

        <div id="message" class="message"></div>


        <!-- ADD / EDIT FORM -->

        <div id="formContainer" class="form-container hidden">

            <h3 id="formTitle">
                Add Equipment
            </h3>


            <form id="equipmentForm">

                <input type="hidden" id="equipmentId">


                <div class="form-grid">

                    <!-- EQUIPMENT NAME -->

                    <div class="form-group">

                        <label for="equipmentName">
                            Equipment Name
                        </label>

                        <input
                            type="text"
                            id="equipmentName"
                            placeholder="Example: Epson Projector"
                            required
                        >

                    </div>


                    <!-- CATEGORY -->

                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <input
                            type="text"
                            id="category"
                            placeholder="Example: Projector"
                            required
                        >

                    </div>


                    <!-- ASSET CODE -->

                    <div class="form-group">

                        <label for="assetCode">
                            Asset Code
                        </label>

                        <input
                            type="text"
                            id="assetCode"
                            placeholder="Example: PROJ-001"
                            required
                        >

                    </div>


                    <!-- CONDITION -->

                    <div class="form-group">

                        <label for="condition">
                            Condition
                        </label>

                        <select id="condition">

                            <option value="Good">
                                Good
                            </option>

                            <option value="Fair">
                                Fair
                            </option>

                            <option value="For Repair">
                                For Repair
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-buttons">

                    <button
                        type="submit"
                        class="save-btn"
                        id="saveBtn"
                    >
                        Save Equipment
                    </button>

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelBtn"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </div>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search equipment name, category, or asset code..."
            >

        </div>


        <!-- TABLE -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Equipment Name</th>

                        <th>Category</th>

                        <th>Asset Code</th>

                        <th>Condition</th>

                        <th>Availability</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="equipmentTableBody">

                </tbody>

            </table>

        </div>

    </div>


    <!-- SUPABASE LIBRARY -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- SUPABASE CONNECTION -->

    <script src="js/supabase.js"></script>


    <!-- EQUIPMENT JAVASCRIPT -->

    <script src="js/equipment.js"></script>

</body>

</html>
