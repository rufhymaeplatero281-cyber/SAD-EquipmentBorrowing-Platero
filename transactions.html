<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrow Transactions</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
            color: #333;
        }

        nav {
            background: #1e3a8a;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            margin: 0;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-secondary {
            background: #64748b;
            color: white;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .search-box {
            width: 100%;
            margin-bottom: 15px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-borrowed {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-returned {
            background: #dcfce7;
            color: #166534;
        }

        .status-overdue {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav>
    <h2>Equipment Borrowing System</h2>
    <button class="btn-danger" id="logoutBtn">Logout</button>
</nav>

<div class="container">

    <div class="top-bar">
        <button class="btn-secondary" onclick="location.href='index.html'">
            ← Back to Dashboard
        </button>

        <h2>Borrow Transactions</h2>
    </div>

    <div id="message" class="message"></div>

    <!-- BORROW FORM -->
    <div class="card">
        <h3>Record Equipment Borrowing</h3>

        <form id="borrowForm">

            <div class="form-grid">

                <div class="form-group">
                    <label for="equipmentId">Equipment</label>

                    <select id="equipmentId" required>
                        <option value="">-- Select Available Equipment --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="borrowerName">Borrower Name</label>

                    <input
                        type="text"
                        id="borrowerName"
                        placeholder="Enter borrower name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="borrowerType">Borrower Type</label>

                    <select id="borrowerType" required>
                        <option value="">-- Select Type --</option>
                        <option value="Student">Student</option>
                        <option value="Faculty">Faculty</option>
                        <option value="Staff">Staff</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>

                    <input
                        type="text"
                        id="department"
                        placeholder="Enter department"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="dateBorrowed">Date Borrowed</label>

                    <input
                        type="date"
                        id="dateBorrowed"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="dueDate">Due Date</label>

                    <input
                        type="date"
                        id="dueDate"
                        required
                    >
                </div>

            </div>

            <div class="form-buttons">
                <button type="submit" class="btn-primary">
                    Record Borrowing
                </button>

                <button type="button" class="btn-secondary" id="clearBtn">
                    Clear
                </button>
            </div>

        </form>
    </div>


    <!-- TRANSACTIONS -->
    <div class="card">

        <h3>Borrowing Transactions</h3>

        <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="Search borrower, equipment, department, or status..."
        >

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Equipment</th>
                        <th>Borrower</th>
                        <th>Type</th>
                        <th>Department</th>
                        <th>Date Borrowed</th>
                        <th>Due Date</th>
                        <th>Date Returned</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="transactionTableBody">
                    <tr>
                        <td colspan="10">
                            Loading transactions...
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Your Supabase connection -->
<script src="js/supabase.js"></script>

<!-- Transaction JavaScript -->
<script src="js/transactions.js"></script>

</body>
</html>
